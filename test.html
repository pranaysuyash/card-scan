<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Neural Card Scanner</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0a0e27;
        --grad-idle: linear-gradient(
          120deg,
          rgba(59, 130, 246, 0.15) 0%,
          rgba(139, 92, 246, 0.15) 50%,
          rgba(236, 72, 153, 0.15) 100%
        );
        --grad-scan: linear-gradient(
          120deg,
          rgba(56, 189, 248, 0.18) 0%,
          rgba(139, 92, 246, 0.22) 50%,
          rgba(56, 189, 248, 0.18) 100%
        );
        --grad-success: linear-gradient(
          120deg,
          rgba(16, 185, 129, 0.2) 0%,
          rgba(59, 130, 246, 0.18) 100%
        );
        --grad-error: linear-gradient(
          120deg,
          rgba(239, 68, 68, 0.18) 0%,
          rgba(244, 114, 182, 0.18) 100%
        );
      }

      [data-state="idle"] .scan-area {
        background: var(--grad-idle);
      }
      [data-state="scanning"] .scan-area {
        background: var(--grad-scan);
        box-shadow: 0 0 80px rgba(56, 189, 248, 0.45);
      }
      [data-state="complete"] .scan-area {
        background: var(--grad-success);
        box-shadow: 0 0 80px rgba(16, 185, 129, 0.5);
      }
      [data-state="error"] .scan-area {
        background: var(--grad-error);
        box-shadow: 0 0 80px rgba(239, 68, 68, 0.45);
      }

      @keyframes fieldPop {
        0% {
          transform: translateY(6px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .data-row.highlight {
        animation: fieldPop 320ms ease-out both;
      }

      /* Confetti canvas layering */
      #confettiCanvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0e27;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      #particleCanvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      @keyframes holographicShift {
        0%,
        100% {
          background-position: 0% 50%;
          filter: hue-rotate(0deg);
        }
        50% {
          background-position: 100% 50%;
          filter: hue-rotate(30deg);
        }
      }

      @keyframes dataStream {
        0% {
          transform: translateY(-100%);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateY(100%);
          opacity: 0;
        }
      }

      @keyframes ripple {
        0% {
          transform: scale(0.8);
          opacity: 1;
        }
        100% {
          transform: scale(2.5);
          opacity: 0;
        }
      }

      @keyframes morphing {
        0%,
        100% {
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
        50% {
          border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
        }
      }

      @keyframes scanReveal {
        from {
          clip-path: inset(0 100% 0 0);
          opacity: 0;
        }
        to {
          clip-path: inset(0 0 0 0);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes spinReverse {
        from {
          transform: rotate(360deg);
        }
        to {
          transform: rotate(0deg);
        }
      }

      .morphing-blob {
        position: absolute;
        width: 320px;
        height: 320px;
        blur: 100px;
        animation: morphing 8s ease-in-out infinite;
      }

      .blob-1 {
        top: -160px;
        left: -160px;
        background: rgba(138, 75, 234, 0.2);
        filter: blur(100px);
      }

      .blob-2 {
        bottom: -160px;
        right: -160px;
        background: rgba(59, 130, 246, 0.2);
        filter: blur(100px);
        animation-delay: 4s;
      }

      .container {
        width: 90%;
        max-width: 480px;
        position: relative;
        z-index: 10;
        transition: transform 0.1s ease-out;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 40px;
        padding: 40px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 0 60px rgba(102, 126, 234, 0.2);
      }

      .scan-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            rgba(102, 126, 234, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(102, 126, 234, 0.1) 1px, transparent 1px);
        background-size: 20px 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .scan-grid.active {
        opacity: 0.5;
        animation: dataStream 1.5s linear infinite;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
        position: relative;
      }

      .logo-container {
        position: relative;
        display: inline-block;
        margin-bottom: 24px;
      }

      .logo-glow {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        filter: blur(40px);
        opacity: 0.6;
        animation: pulse 2s ease-in-out infinite;
      }

      .logo {
        position: relative;
        width: 96px;
        height: 96px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 60px rgba(59, 130, 246, 0.4);
        transition: transform 0.3s ease-out;
      }

      .logo svg {
        width: 48px;
        height: 48px;
        color: white;
      }

      .logo-ripple {
        position: absolute;
        inset: 0;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 24px;
        animation: ripple 1s ease-out infinite;
        opacity: 0;
      }

      .logo-ripple.active {
        opacity: 1;
      }

      .title {
        font-size: 48px;
        font-weight: 900;
        color: white;
        margin-bottom: 12px;
        text-shadow: 0 0 10px rgba(102, 126, 234, 0.8),
          0 0 20px rgba(102, 126, 234, 0.6), 0 0 30px rgba(102, 126, 234, 0.4),
          0 0 40px rgba(102, 126, 234, 0.2);
      }

      .subtitle {
        font-size: 20px;
        font-weight: 300;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 50px;
        font-size: 14px;
        font-weight: 500;
        color: #86efac;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background: #4ade80;
        border-radius: 50%;
        animation: pulse 2s ease-in-out infinite;
      }

      .scan-area {
        position: relative;
        aspect-ratio: 1.6;
        background: var(--grad-idle);
        background-size: 200% 200%;
        animation: holographicShift 10s ease infinite;
        border-radius: 24px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.5s;
        margin-bottom: 32px;
      }

      .scan-area:hover {
        transform: scale(1.01);
        box-shadow: 0 0 40px rgba(102, 126, 234, 0.3);
      }

      .scan-area.scanning {
        transform: scale(1.02);
        box-shadow: 0 0 60px rgba(102, 126, 234, 0.6);
      }

      .scan-area.complete {
        box-shadow: 0 0 60px rgba(34, 197, 94, 0.6);
      }

      .corner-label {
        position: absolute;
        font-family: "Courier New", monospace;
        font-size: 12px;
        opacity: 0.7;
      }

      .corner-label.top-left {
        top: 16px;
        left: 16px;
        color: #60a5fa;
      }
      .corner-label.top-right {
        top: 16px;
        right: 16px;
        color: #a78bfa;
      }
      .corner-label.bottom-left {
        bottom: 16px;
        left: 16px;
        color: #60a5fa;
      }
      .corner-label.bottom-right {
        bottom: 16px;
        right: 16px;
        color: #a78bfa;
      }

      .corner-bracket {
        position: absolute;
        width: 40px;
        height: 40px;
        stroke-width: 3;
        stroke: #667eea;
        fill: none;
        stroke-linecap: round;
        transition: stroke 0.3s;
        filter: drop-shadow(0 0 8px rgba(102, 126, 234, 0.8));
      }

      .complete .corner-bracket {
        stroke: #22c55e;
      }

      .scan-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          transparent,
          #60a5fa,
          #a78bfa,
          transparent
        );
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
        opacity: 0;
        transition: top 0.03s linear, opacity 0.3s;
      }

      .scan-line.active {
        opacity: 1;
      }

      .data-stream-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: rgba(96, 165, 250, 0.5);
        animation: dataStream 2s ease-in-out infinite;
      }

      .scan-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.8);
      }

      .scan-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        opacity: 0.6;
        animation: pulse 2s ease-in-out infinite;
      }

      .scan-text {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .scan-subtext {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.4);
      }

      .spinner-container {
        position: relative;
        width: 128px;
        height: 128px;
        margin-bottom: 16px;
      }

      .spinner-ring {
        position: absolute;
        inset: 0;
        border: 4px solid rgba(59, 130, 246, 0.2);
        border-radius: 50%;
      }

      .spinner-ring-1 {
        border-top-color: #3b82f6;
        animation: spin 1s linear infinite;
      }

      .spinner-ring-2 {
        inset: 8px;
        border-top-color: #8b5cf6;
        animation: spinReverse 1.5s linear infinite;
      }

      .spinner-percent {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
        color: white;
      }

      .check-icon {
        width: 80px;
        height: 80px;
        color: #4ade80;
        margin-bottom: 16px;
        animation: ripple 0.6s ease-out;
      }

      .progress-bar {
        height: 8px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50px;
        overflow: hidden;
        margin-top: 16px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .progress-bar.active {
        opacity: 1;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        border-radius: 50px;
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
        transition: width 0.3s ease-out;
      }

      .data-card {
        background: linear-gradient(
          135deg,
          rgba(34, 197, 94, 0.1),
          rgba(59, 130, 246, 0.1)
        );
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 32px;
        backdrop-filter: blur(20px);
        animation: scanReveal 0.4s ease-out;
      }

      .data-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .data-title {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #86efac;
        font-weight: bold;
        font-size: 18px;
      }

      .confidence-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        background: rgba(34, 197, 94, 0.2);
        border-radius: 50px;
        color: #86efac;
        font-family: "Courier New", monospace;
        font-size: 14px;
      }

      .data-row {
        display: flex;
        gap: 12px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .data-label {
        color: rgba(255, 255, 255, 0.4);
        font-family: "Courier New", monospace;
        font-size: 12px;
        min-width: 80px;
      }

      .data-value {
        color: white;
        font-weight: 600;
        flex: 1;
      }

      .data-value.email {
        color: #60a5fa;
        font-family: "Courier New", monospace;
        font-size: 14px;
      }

      .data-value.phone {
        font-family: "Courier New", monospace;
      }

      .actions {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
      }

      .btn {
        flex: 1;
        padding: 20px 32px;
        border: none;
        border-radius: 16px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn-primary {
        background: linear-gradient(90deg, #2563eb, #7c3aed);
        color: white;
        box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
      }

      .btn-primary:hover:not(:disabled) {
        box-shadow: 0 0 50px rgba(102, 126, 234, 0.8);
        transform: scale(1.02);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary .btn-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        opacity: 0;
        transition: opacity 0.3s;
      }

      .btn-primary:hover:not(:disabled) .btn-overlay {
        opacity: 1;
      }

      .btn-content {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: scale(1.02);
      }

      .btn-success {
        background: linear-gradient(90deg, #059669, #10b981);
        color: white;
        box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
      }

      .btn-success:hover {
        box-shadow: 0 0 50px rgba(34, 197, 94, 0.8);
        transform: scale(1.02);
      }

      .footer {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "Courier New", monospace;
        font-size: 12px;
      }

      .footer-left {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #60a5fa;
      }

      .footer-right {
        color: #a78bfa;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="particleCanvas"></canvas>
    <canvas id="confettiCanvas"></canvas>

    <div class="container" id="container">
      <div class="morphing-blob blob-1"></div>
      <div class="morphing-blob blob-2"></div>

      <div class="glass-card">
        <div class="scan-grid" id="scanGrid"></div>

        <div class="header">
          <div class="logo-container">
            <div class="logo-glow"></div>
            <div class="logo" id="logo">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z M9 22V12h6v10"
                />
                <rect
                  x="6"
                  y="4"
                  width="12"
                  height="3"
                  rx="1"
                  stroke-linecap="round"
                />
              </svg>
              <div class="logo-ripple" id="logoRipple"></div>
            </div>
          </div>

          <h1 class="title">QUANTUM</h1>
          <div class="subtitle">Neural Card Intelligence</div>
          <div class="status-badge">
            <div class="status-dot"></div>
            <span>AI Systems Online</span>
          </div>
        </div>

        <div class="scan-area" id="scanArea">
          <div class="corner-label top-left">RES: 4096x2560</div>
          <div class="corner-label top-right">AI: v4.7.2</div>
          <div class="corner-label bottom-left">FPS: 120</div>
          <div class="corner-label bottom-right" id="statusLabel">READY</div>

          <svg
            style="
              position: absolute;
              inset: 0;
              width: 100%;
              height: 100%;
              pointer-events: none;
            "
          >
            <path class="corner-bracket" d="M 20 60 L 20 20 L 60 20" />
            <path
              class="corner-bracket"
              d="M calc(100% - 20) 60 L calc(100% - 20) 20 L calc(100% - 60) 20"
              style="transform: translateX(-100%)"
            />
            <path
              class="corner-bracket"
              d="M 20 calc(100% - 60) L 20 calc(100% - 20) L 60 calc(100% - 20)"
              style="transform: translateY(-100%)"
            />
            <path
              class="corner-bracket"
              d="M calc(100% - 20) calc(100% - 60) L calc(100% - 20) calc(100% - 20) L calc(100% - 60) calc(100% - 20)"
              style="transform: translate(-100%, -100%)"
            />
          </svg>

          <div class="scan-line" id="scanLine"></div>
          <div id="dataStreams"></div>

          <div class="scan-content" id="scanContent">
            <svg
              class="scan-icon"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z"
              />
            </svg>
            <div class="scan-text">Initiate Neural Scan</div>
            <div class="scan-subtext">Tap to begin quantum analysis</div>
          </div>

          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <div class="data-card hidden" id="dataCard">
          <div class="data-header">
            <div class="data-title">
              <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"
                />
              </svg>
              Extracted Data
            </div>
            <div class="confidence-badge">
              <svg
                width="16"
                height="16"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
              <span id="confidence">98.7%</span>
            </div>
          </div>

          <div id="dataRows"></div>
        </div>

        <div class="actions" id="actions">
          <button class="btn btn-primary" id="scanBtn" onclick="startScan()">
            <div class="btn-overlay"></div>
            <div class="btn-content">
              <svg
                width="24"
                height="24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z M9 22V12h6v10"
                />
              </svg>
              <span id="scanBtnText">Neural Scan</span>
            </div>
          </button>
          <button class="btn btn-secondary" onclick="alert('Gallery feature')">
            Gallery
          </button>
        </div>

        <div class="footer">
          <div class="footer-left">
            <div class="status-dot"></div>
            <span>QUANTUM CORE ACTIVE</span>
          </div>
          <div class="footer-right" id="clock"></div>
        </div>
      </div>
    </div>

    <script>
      // Particle system
      const canvas = document.getElementById("particleCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let mousePos = { x: 0, y: 0 };

      class Particle {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.size = Math.random() * 2 + 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.hue = Math.random() * 60 + 200;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

          const dx = mousePos.x - this.x;
          const dy = mousePos.y - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 200) {
            this.vx += dx * 0.00002;
            this.vy += dy * 0.00002;
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, ${this.opacity})`;
          ctx.fill();
        }
      }

      const particles = Array.from({ length: 100 }, () => new Particle());

      function animate() {
        ctx.fillStyle = "rgba(10, 14, 39, 0.1)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach((particle) => {
          particle.update();
          particle.draw();
        });

        particles.forEach((p1, i) => {
          particles.slice(i + 1).forEach((p2) => {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 100) {
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(102, 126, 234, ${
                0.15 * (1 - distance / 100)
              })`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          });
        });

        requestAnimationFrame(animate);
      }

      animate();

      // Device tilt parallax (mobile)
      if (window.DeviceOrientationEvent) {
        window.addEventListener("deviceorientation", (e) => {
          const beta = e.beta || 0; // x-tilt [-180,180]
          const gamma = e.gamma || 0; // y-tilt [-90,90]
          const container = document.getElementById("container");
          const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
          const rx = clamp((beta / 90) * 6, -6, 6);
          const ry = clamp((gamma / 90) * 6, -6, 6);
          container.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg)`;
        });
      }

      // Mouse tracking
      document.addEventListener("mousemove", (e) => {
        mousePos = { x: e.clientX, y: e.clientY };

        const container = document.getElementById("container");
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * 5;
        const rotateY = ((x - centerX) / centerX) * 5;

        container.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

        const logo = document.getElementById("logo");
        const intensity =
          Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2)) / 200;
        const scale = 1 + Math.min(intensity, 1) * 0.1;
        logo.style.transform = `rotateX(${intensity * 20}deg) rotateY(${
          intensity * 20
        }deg) scale(${scale})`;
      });

      // Clock
      function updateClock() {
        document.getElementById("clock").textContent =
          new Date().toLocaleTimeString();
      }
      updateClock();
      setInterval(updateClock, 1000);

      // Confetti system (success micro-interaction)
      const confettiCanvas = document.getElementById("confettiCanvas");
      const cctx = confettiCanvas.getContext("2d");
      const resizeConfetti = () => {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      };
      resizeConfetti();
      window.addEventListener("resize", resizeConfetti);
      let confetti = [];
      function launchConfetti(bursts = 40) {
        confetti = [];
        for (let i = 0; i < bursts; i++) {
          confetti.push({
            x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 120,
            y: confettiCanvas.height / 2 - 80 + (Math.random() - 0.5) * 60,
            vx: (Math.random() - 0.5) * 6,
            vy: Math.random() * -6 - 2,
            g: 0.18 + Math.random() * 0.08,
            size: 3 + Math.random() * 4,
            hue: 160 + Math.random() * 200,
            life: 90 + Math.random() * 30,
          });
        }
      }
      function tickConfetti() {
        cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confetti.forEach((p) => {
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 1;
          cctx.fillStyle = `hsl(${p.hue}, 80%, 60%)`;
          cctx.fillRect(p.x, p.y, p.size, p.size * 0.6);
        });
        confetti = confetti.filter(
          (p) => p.life > 0 && p.y < confettiCanvas.height + 20
        );
        requestAnimationFrame(tickConfetti);
      }
      requestAnimationFrame(tickConfetti);

      // Scanning logic
      let isScanning = false;
      let scanProgress = 0;

      function startScan() {
        if (isScanning) return;

        isScanning = true;
        scanProgress = 0;
        document.body.setAttribute("data-state", "scanning");

        const scanArea = document.getElementById("scanArea");
        const scanBtn = document.getElementById("scanBtn");
        const scanBtnText = document.getElementById("scanBtnText");
        const scanLine = document.getElementById("scanLine");
        const progressBar = document.getElementById("progressBar");
        const progressFill = document.getElementById("progressFill");
        const scanContent = document.getElementById("scanContent");
        const statusLabel = document.getElementById("statusLabel");
        const scanGrid = document.getElementById("scanGrid");
        const logoRipple = document.getElementById("logoRipple");
        const dataCard = document.getElementById("dataCard");

        scanArea.classList.add("scanning");
        scanBtn.disabled = true;
        scanBtnText.textContent = "Scanning...";
        scanLine.classList.add("active");
        progressBar.classList.add("active");
        statusLabel.textContent = "SCANNING";
        scanGrid.classList.add("active");
        logoRipple.classList.add("active");
        dataCard.classList.add("hidden");

        // Build data streams
        const dataStreams = document.getElementById("dataStreams");
        dataStreams.innerHTML = "";
        for (let i = 0; i < 5; i++) {
          const stream = document.createElement("div");
          stream.className = "data-stream-line";
          stream.style.animationDelay = `${i * 0.2}s`;
          dataStreams.appendChild(stream);
        }

        scanContent.innerHTML = `
          <div class="spinner-container">
            <div class="spinner-ring spinner-ring-1"></div>
            <div class="spinner-ring spinner-ring-2"></div>
            <div class="spinner-percent">0%</div>
          </div>
          <div class="scan-text">Processing Neural Data</div>
          <div class="scan-subtext" style="font-family: 'Courier New', monospace; color: #60a5fa;">Analyzing quantum patterns...</div>
        `;

        const start = performance.now();
        const duration = 2600; // ms
        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        function raf(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = easeInOutCubic(t);
          scanProgress = Math.floor(eased * 100);
          const spinnerPercent = document.querySelector(".spinner-percent");
          if (spinnerPercent) spinnerPercent.textContent = scanProgress + "%";
          scanLine.style.top = eased * 100 + "%";
          progressFill.style.width = eased * 100 + "%";
          if (t < 1) requestAnimationFrame(raf);
          else completeScan();
        }
        requestAnimationFrame(raf);
      }

      function completeScan() {
        const scanArea = document.getElementById("scanArea");
        const scanContent = document.getElementById("scanContent");
        const statusLabel = document.getElementById("statusLabel");
        const scanLine = document.getElementById("scanLine");
        const scanGrid = document.getElementById("scanGrid");
        const logoRipple = document.getElementById("logoRipple");
        const dataStreams = document.getElementById("dataStreams");

        isScanning = false;
        scanArea.classList.remove("scanning");
        scanArea.classList.add("complete");
        statusLabel.textContent = "COMPLETE";
        document.body.setAttribute("data-state", "complete");
        launchConfetti(60);
        scanLine.classList.remove("active");
        scanGrid.classList.remove("active");
        logoRipple.classList.remove("active");
        dataStreams.innerHTML = "";

        scanContent.innerHTML = `
                <svg class="check-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <div class="scan-text" style="color: #86efac;">Scan Complete</div>
                <div class="scan-subtext">Extracting data...</div>
            `;

        setTimeout(() => {
          showExtractedData();
        }, 500);
      }

      function showExtractedData() {
        const data = {
          name: "ALEX CHEN",
          company: "NEURAL SYSTEMS INC",
          title: "Chief Innovation Officer",
          email: "alex.chen@neuralsys.io",
          phone: "+1 (555) 847-2931",
        };

        const dataCard = document.getElementById("dataCard");
        const dataRows = document.getElementById("dataRows");
        const actions = document.getElementById("actions");

        dataRows.innerHTML = `
                <div class="data-row">
                    <div class="data-label">NAME</div>
                    <div class="data-value">${data.name}</div>
                </div>
                <div class="data-row">
                    <div class="data-label">COMPANY</div>
                    <div class="data-value">${data.company}</div>
                </div>
                <div class="data-row">
                    <div class="data-label">TITLE</div>
                    <div class="data-value">${data.title}</div>
                </div>
                <div class="data-row">
                    <div class="data-label">EMAIL</div>
                    <div class="data-value email">${data.email}</div>
                </div>
                <div class="data-row">
                    <div class="data-label">PHONE</div>
                    <div class="data-value phone">${data.phone}</div>
                </div>
            `;

        dataCard.classList.remove("hidden");
        // Stagger field highlights
        [...dataRows.children].forEach((row, i) => {
          row.classList.add("highlight");
          row.style.animationDelay = `${i * 90}ms`;
        });

        actions.innerHTML = `
                <button class="btn btn-success" onclick="resetScan()">
                    Scan Another Card
                </button>
            `;
      }

      function resetScan() {
        const scanArea = document.getElementById("scanArea");
        const scanContent = document.getElementById("scanContent");
        const statusLabel = document.getElementById("statusLabel");
        const dataCard = document.getElementById("dataCard");
        const actions = document.getElementById("actions");
        const progressBar = document.getElementById("progressBar");
        const progressFill = document.getElementById("progressFill");

        document.body.setAttribute("data-state", "idle");
        scanArea.classList.remove("complete");
        statusLabel.textContent = "READY";
        dataCard.classList.add("hidden");
        progressBar.classList.remove("active");
        progressFill.style.width = "0%";

        scanContent.innerHTML = `
                <svg class="scan-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z"/>
                </svg>
                <div class="scan-text">Initiate Neural Scan</div>
                <div class="scan-subtext">Tap to begin quantum analysis</div>
            `;

        actions.innerHTML = `
                <button class="btn btn-primary" id="scanBtn" onclick="startScan()">
                    <div class="btn-overlay"></div>
                    <div class="btn-content">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z M9 22V12h6v10"/>
                        </svg>
                        <span id="scanBtnText">Neural Scan</span>
                    </div>
                </button>
                <button class="btn btn-secondary" onclick="alert('Gallery feature')">
                    Gallery
                </button>
            `;
      }

      // Click on scan area
      document.getElementById("scanArea").addEventListener("click", startScan);
      // Default visual state
      document.body.setAttribute("data-state", "idle");

      // Window resize
      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>
