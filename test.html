<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futuristic Card Scanner</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(
          135deg,
          #0a0e27 0%,
          #1a1f3a 50%,
          #0f1419 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      /* Animated background particles */
      .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: rgba(100, 200, 255, 0.5);
        border-radius: 50%;
        animation: float 20s infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translate(100vw, -100vh);
          opacity: 0;
        }
      }

      .container {
        width: 90%;
        max-width: 420px;
        position: relative;
        z-index: 10;
      }

      /* Glass morphism card */
      .scanner-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border-radius: 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        padding: 32px;
        position: relative;
        overflow: hidden;
      }

      .scanner-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% {
          left: -100%;
        }
        100% {
          left: 100%;
        }
      }

      .header {
        text-align: center;
        margin-bottom: 32px;
      }

      .logo {
        width: 60px;
        height: 60px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .logo svg {
        width: 32px;
        height: 32px;
        color: white;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        color: white;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
        font-weight: 400;
      }

      /* Holographic scan area */
      .scan-area {
        position: relative;
        aspect-ratio: 1.586;
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.1) 0%,
          rgba(118, 75, 162, 0.1) 100%
        );
        border-radius: 20px;
        border: 2px dashed rgba(102, 126, 234, 0.4);
        margin-bottom: 32px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .scan-area:hover {
        border-color: rgba(102, 126, 234, 0.8);
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.15) 0%,
          rgba(118, 75, 162, 0.15) 100%
        );
        transform: scale(1.02);
      }

      .scan-line {
        position: absolute;
        width: 100%;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          #667eea,
          #764ba2,
          transparent
        );
        animation: scan 2s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
      }

      @keyframes scan {
        0%,
        100% {
          top: 0;
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          top: 100%;
          opacity: 0;
        }
      }

      .scan-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.7);
      }

      .scan-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 16px;
        opacity: 0.6;
      }

      .scan-text {
        font-size: 16px;
        font-weight: 500;
      }

      /* Corner markers */
      .corner {
        position: absolute;
        width: 40px;
        height: 40px;
        border: 3px solid rgba(102, 126, 234, 0.6);
      }

      .corner.top-left {
        top: 12px;
        left: 12px;
        border-right: none;
        border-bottom: none;
        border-radius: 8px 0 0 0;
      }

      .corner.top-right {
        top: 12px;
        right: 12px;
        border-left: none;
        border-bottom: none;
        border-radius: 0 8px 0 0;
      }

      .corner.bottom-left {
        bottom: 12px;
        left: 12px;
        border-right: none;
        border-top: none;
        border-radius: 0 0 0 8px;
      }

      .corner.bottom-right {
        bottom: 12px;
        right: 12px;
        border-left: none;
        border-top: none;
        border-radius: 0 0 8px 0;
      }

      /* Action buttons */
      .actions {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }

      .btn {
        flex: 1;
        padding: 16px;
        border: none;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.12);
        transform: translateY(-2px);
      }

      /* Features list */
      .features {
        display: grid;
        gap: 12px;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.3s ease;
      }

      .feature:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(102, 126, 234, 0.3);
      }

      .feature-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.2) 0%,
          rgba(118, 75, 162, 0.2) 100%
        );
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .feature-icon svg {
        width: 20px;
        height: 20px;
        color: #667eea;
      }

      .feature-content {
        flex: 1;
      }

      .feature-title {
        color: white;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
      }

      .feature-desc {
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
      }

      /* Glow effect */
      .glow {
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle,
          rgba(102, 126, 234, 0.3) 0%,
          transparent 70%
        );
        border-radius: 50%;
        pointer-events: none;
        filter: blur(40px);
      }

      .glow-1 {
        top: -150px;
        right: -100px;
        animation: glow-move-1 8s ease-in-out infinite;
      }

      .glow-2 {
        bottom: -150px;
        left: -100px;
        background: radial-gradient(
          circle,
          rgba(118, 75, 162, 0.3) 0%,
          transparent 70%
        );
        animation: glow-move-2 10s ease-in-out infinite;
      }

      @keyframes glow-move-1 {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(-50px, 50px);
        }
      }

      @keyframes glow-move-2 {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(50px, -50px);
        }
      }
    </style>
  </head>
  <body>
    <!-- Animated particles -->
    <script>
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement("div");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.top = Math.random() * 100 + "%";
        particle.style.animationDelay = Math.random() * 20 + "s";
        particle.style.animationDuration = 15 + Math.random() * 10 + "s";
        document.body.appendChild(particle);
      }
    </script>

    <div class="container">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>

      <div class="scanner-card">
        <div class="header">
          <div class="logo">
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M3 4h18v4h-2V6H5v2H3V4zm0 16h2v-2h14v2h2v-4H3v4zm5-9h8v2H8v-2z"
              />
            </svg>
          </div>
          <h1>NeuralScan</h1>
          <p class="subtitle">AI-Powered Card Recognition</p>
        </div>

        <div class="scan-area">
          <div class="scan-line"></div>
          <div class="corner top-left"></div>
          <div class="corner top-right"></div>
          <div class="corner bottom-left"></div>
          <div class="corner bottom-right"></div>

          <div class="scan-placeholder">
            <svg
              class="scan-icon"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"
              />
            </svg>
            <p class="scan-text">Tap to scan card</p>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary">Capture</button>
          <button class="btn btn-secondary">Gallery</button>
        </div>

        <div class="features">
          <div class="feature">
            <div class="feature-icon">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                />
              </svg>
            </div>
            <div class="feature-content">
              <div class="feature-title">Instant Recognition</div>
              <div class="feature-desc">AI extracts data in milliseconds</div>
            </div>
          </div>

          <div class="feature">
            <div class="feature-icon">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                />
              </svg>
            </div>
            <div class="feature-content">
              <div class="feature-title">Secure Storage</div>
              <div class="feature-desc">End-to-end encrypted data</div>
            </div>
          </div>

          <div class="feature">
            <div class="feature-icon">
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"
                />
              </svg>
            </div>
            <div class="feature-content">
              <div class="feature-title">Cloud Sync</div>
              <div class="feature-desc">Access anywhere, anytime</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
